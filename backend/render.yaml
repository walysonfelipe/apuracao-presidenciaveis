services:
  - type: web
    name: corrida-apuracao-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Serviço pago: API e coleta contínua com SQLite persistente.
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: apuracao-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: COLLECTOR_DB
        value: /data/results.sqlite
      - key: COLLECTOR_UF
        value: all
      - key: COLLECTOR_ROUND
        value: all
      - key: COLLECTOR_OFFICES
        value: all
      - key: COLLECTOR_RPS
        value: "40"
      - key: COLLECTOR_CONCURRENCY
        value: "8"
      - key: R2_ENABLED
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: eleicao
      - key: R2_PREFIX
        value: resultados
      - key: R2_PUBLIC_BASE_URL
        value: https://eleicoes.agendasalao.com
      - key: API_ALLOWED_ORIGINS
        value: https://corridaeleicao.vercel.app,https://eleicoes.agendasalao.com
